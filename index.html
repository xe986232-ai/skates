<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkir Kamera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9ecea;
    --panel: rgba(246, 248, 245, 0.97);
    --ink: #1b2220;
    --muted: #59645f;
    --line: rgba(27, 34, 32, 0.16);
    --chip: rgba(27, 34, 32, 0.07);
    --accent: #2b6ea6;
    --accent-ink: #ffffff;
    --danger: #b3332f;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1312;
      --panel: rgba(23, 27, 26, 0.96);
      --ink: #edf1ee;
      --muted: #9aa6a1;
      --line: rgba(237, 241, 238, 0.16);
      --chip: rgba(237, 241, 238, 0.09);
      --accent: #86bde8;
      --accent-ink: #0d1a24;
      --danger: #ff8f8a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1312;
    --panel: rgba(23, 27, 26, 0.96);
    --ink: #edf1ee;
    --muted: #9aa6a1;
    --line: rgba(237, 241, 238, 0.16);
    --chip: rgba(237, 241, 238, 0.09);
    --accent: #86bde8;
    --accent-ink: #0d1a24;
    --danger: #ff8f8a;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Lapisan tampilan */
  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; z-index: 0; transform: translateZ(0); }
  #grid {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background-image:
      linear-gradient(to right, rgba(70,150,230,.65) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(70,150,230,.65) 1px, transparent 1px);
    background-size: 12.5vmin 12.5vmin;
    background-position: center;
  }
  #stage { position: fixed; inset: 0; z-index: 2; touch-action: none; overflow: hidden; }
  #stage.locked { pointer-events: none; }
  #sketch { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; will-change: transform, opacity; user-select: none; -webkit-user-drag: none; }

  /* Bar atas */
  #top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    pointer-events: none;
  }
  #top > * { pointer-events: auto; }
  .fabs { display: flex; gap: 8px; }
  .fab {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--panel); color: var(--ink);
    display: grid; place-items: center;
    box-shadow: 0 1px 0 var(--line) inset, 0 2px 10px rgba(0,0,0,.25);
  }
  .fab[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .brand {
    padding: 9px 14px; border-radius: 999px; background: var(--panel);
    font-weight: 700; font-size: 15px; letter-spacing: .01em;
  }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Panel bawah */
  #panel {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    max-width: 560px; margin: 0 auto;
    padding: 14px 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
    background: var(--panel); border-radius: 22px 22px 0 0;
    box-shadow: 0 -6px 30px rgba(0,0,0,.28);
    display: grid; gap: 12px;
  }
  .actions { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .tool {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 10px 2px 8px; border-radius: 12px; background: var(--chip);
    font-size: 12px; font-weight: 600;
  }
  .tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .tool.primary { background: var(--accent); color: var(--accent-ink); }
  #panel[data-empty="true"] .needs { opacity: .4; pointer-events: none; }

  .row { display: grid; gap: 8px; }
  .row-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); font-weight: 600; }
  .row-head output { color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); height: 28px; margin: 0; }

  .modes { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--chip); }
  .seg button { padding: 8px 18px; border-radius: 999px; background: transparent; font-weight: 600; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .swatches { display: flex; gap: 10px; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); }
  .sw[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 2px; }

  #showUI {
    position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 10;
    width: 48px; height: 48px; border-radius: 50%; display: none; place-items: center;
    background: var(--panel); color: var(--ink); box-shadow: 0 2px 10px rgba(0,0,0,.3);
  }
  body.clean #panel, body.clean #top { display: none; }
  body.clean #showUI { display: grid; }

  /* Layar awal */
  #start {
    position: fixed; inset: 0; z-index: 20; background: var(--bg);
    display: grid; align-content: center; justify-items: start; gap: 22px;
    padding: calc(env(safe-area-inset-top, 0px) + 28px) 26px calc(env(safe-area-inset-bottom, 0px) + 28px);
    max-width: 560px; margin: 0 auto; overflow-y: auto;
  }
  #start h1 { font-size: clamp(38px, 11vw, 60px); line-height: 1; margin: 0; letter-spacing: -.02em; font-weight: 700; }
  #start p { margin: 0; font-size: 17px; line-height: 1.5; color: var(--muted); max-width: 42ch; }
  #start .paper {
    width: 100%; max-width: 330px; aspect-ratio: 4 / 3; border-radius: 6px; position: relative;
    background: #f7f7f3; border: 1px solid var(--line); overflow: hidden;
  }
  #start .paper svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .btns { display: grid; gap: 10px; width: 100%; max-width: 330px; }
  .btn { padding: 15px 18px; border-radius: 14px; font-weight: 700; font-size: 16px; background: var(--chip); }
  .btn.main { background: var(--accent); color: var(--accent-ink); }
  #status { font-size: 14px; color: var(--muted); min-height: 1.2em; }
  #err { font-size: 15px; line-height: 1.45; color: var(--danger); max-width: 42ch; }

  #toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 66px); transform: translateX(-50%);
    z-index: 30; background: var(--panel); color: var(--ink); padding: 9px 16px; border-radius: 999px;
    font-size: 14px; font-weight: 600; box-shadow: 0 2px 12px rgba(0,0,0,.3); opacity: 0; pointer-events: none;
    transition: opacity .2s; white-space: nowrap;
  }
  #toast.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>
<div id="grid" hidden></div>
<div id="stage"><canvas id="sketch" hidden></canvas></div>

<header id="top">
  <div class="brand">Kalkir Kamera</div>
  <div class="fabs">
    <button class="fab" id="torch" aria-label="Nyalakan senter" aria-pressed="false" hidden>
      <svg class="i" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg>
    </button>
    <button class="fab" id="switchCam" aria-label="Ganti kamera depan/belakang">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 15a8 8 0 0 1-14 3l-2-2"/><path d="M20 4v4h-4M4 20v-4h4"/></svg>
    </button>
    <button class="fab" id="hideUI" aria-label="Sembunyikan kontrol">
      <svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
</header>

<section id="panel" data-empty="true" aria-label="Kontrol sketsa">
  <div class="actions">
    <button class="tool primary" id="pick">
      <svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>
      Sketsa
    </button>
    <button class="tool needs" id="lock" aria-pressed="false">
      <svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path id="lockPath" d="M8 11V8a4 4 0 0 1 7.6-1.7"/></svg>
      Kunci
    </button>
    <button class="tool needs" id="flip" aria-pressed="false">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M8 7L3 12l5 5V7zM16 7l5 5-5 5V7z"/></svg>
      Balik
    </button>
    <button class="tool" id="gridBtn" aria-pressed="false">
      <svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
      Grid
    </button>
    <button class="tool needs" id="reset">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg>
      Reset
    </button>
  </div>

  <div class="modes needs">
    <div class="seg" role="group" aria-label="Mode tampilan sketsa">
      <button id="modeFoto" aria-pressed="true">Foto</button>
      <button id="modeGaris" aria-pressed="false">Garis</button>
    </div>
    <div class="swatches" id="swatches" role="group" aria-label="Warna garis" hidden>
      <button class="sw" data-c="#3b8bd6" style="background:#3b8bd6" aria-label="Biru" aria-pressed="true"></button>
      <button class="sw" data-c="#e5484d" style="background:#e5484d" aria-label="Merah" aria-pressed="false"></button>
      <button class="sw" data-c="#2fbf71" style="background:#2fbf71" aria-label="Hijau" aria-pressed="false"></button>
      <button class="sw" data-c="#ffffff" style="background:#ffffff" aria-label="Putih" aria-pressed="false"></button>
    </div>
  </div>

  <div class="row needs">
    <div class="row-head"><label for="opacity">Transparansi sketsa</label><output id="opacityOut">55%</output></div>
    <input type="range" id="opacity" min="5" max="100" value="55">
  </div>
  <div class="row needs" id="thrRow" hidden>
    <div class="row-head"><label for="thr">Kepekaan garis</label><output id="thrOut">175</output></div>
    <input type="range" id="thr" min="60" max="240" value="175">
  </div>
</section>

<button id="showUI" aria-label="Tampilkan kontrol">
  <svg class="i" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
</button>

<div id="toast" role="status" aria-live="polite"></div>

<section id="start">
  <h1>Kalkir Kamera</h1>
  <p>Taruh HP di atas kertas, lalu sketsa muncul tembus pandang di atas tampilan kamera. Tinggal ikuti garisnya dengan pensil.</p>
  <div class="paper" aria-hidden="true">
    <svg viewBox="0 0 330 248">
      <path d="M0 172 L330 172" stroke="#c9c9c0" stroke-width="1" fill="none"/>
      <path d="M92 168 L112 68 L232 68 L252 168" stroke="#3b8bd6" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>
      <path d="M112 68 L172 30 L232 68" stroke="#3b8bd6" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>
      <path d="M96 160 L114 74 L226 74" stroke="#2a2a28" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="btns">
    <button class="btn main" id="btnCam">Buka kamera</button>
    <button class="btn" id="btnPick">Pilih sketsa dari galeri</button>
    <button class="btn" id="btnSample">Coba sketsa contoh</button>
    <button class="btn" id="btnNoCam" hidden>Lanjut tanpa kamera</button>
  </div>
  <div id="status" aria-live="polite"></div>
  <div id="err" role="alert" hidden></div>
</section>

<input type="file" id="file" accept="image/*" hidden>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cam = $('cam'), stage = $('stage'), sketch = $('sketch'), ctx = sketch.getContext('2d'), panel = $('panel');

  const st = { x: 0, y: 0, s: 1, r: 0, flip: false };
  const opt = { mode: 'foto', color: '#3b8bd6', thr: 175, opacity: 55, locked: false };
  let src = null, srcData = null, outData = null;
  let stream = null, track = null, facing = 'environment', torchOn = false, wake = null;

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
  }

  /* ---------- Kamera ---------- */
  function stopCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; track = null; torchOn = false;
    $('torch').setAttribute('aria-pressed', 'false');
  }

  async function startCamera() {
    stopCamera();
    const err = $('err');
    err.hidden = true;
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { name: 'Unsupported' };
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30, max: 30 } },
        audio: false
      });
      cam.srcObject = stream;
      cam.style.transform = facing === 'user' ? 'translateZ(0) scaleX(-1)' : 'translateZ(0)';
      await cam.play().catch(() => {});
      track = stream.getVideoTracks()[0];
      const caps = (track.getCapabilities && track.getCapabilities()) || {};
      $('torch').hidden = !caps.torch;
      $('start').hidden = true;
      requestWake();
    } catch (e) {
      let msg = 'Kamera tidak bisa dibuka.';
      if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) {
        msg = 'Akses kamera diblokir. Izinkan kamera untuk halaman ini. Kalau halaman terbuka di dalam aplikasi atau bingkai, buka langsung di Chrome atau Safari.';
      } else if (e && e.name === 'NotFoundError') {
        msg = 'Kamera tidak ditemukan di perangkat ini.';
      } else if (e && e.name === 'Unsupported') {
        msg = 'Browser ini belum mendukung kamera. Coba Chrome atau Safari terbaru, lewat alamat https.';
      }
      err.textContent = msg; err.hidden = false;
      $('btnNoCam').hidden = false;
    }
  }

  async function requestWake() {
    try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (_) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && stream) requestWake();
  });

  $('btnCam').onclick = startCamera;
  $('btnNoCam').onclick = () => { $('start').hidden = true; };
  $('switchCam').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCamera(); };
  $('torch').onclick = async () => {
    if (!track) return;
    torchOn = !torchOn;
    try {
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      $('torch').setAttribute('aria-pressed', String(torchOn));
    } catch (_) { torchOn = false; toast('Senter tidak tersedia'); }
  };

  /* ---------- Sketsa ---------- */
  function setSource(el, name) {
    const w0 = el.naturalWidth || el.width, h0 = el.naturalHeight || el.height;
    const k = Math.min(1, 1400 / Math.max(w0, h0));
    const w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
    src = document.createElement('canvas'); src.width = w; src.height = h;
    const c = src.getContext('2d', { willReadFrequently: true });
    c.fillStyle = '#fff'; c.fillRect(0, 0, w, h);
    c.drawImage(el, 0, 0, w, h);
    srcData = c.getImageData(0, 0, w, h);
    outData = ctx.createImageData(w, h);
    sketch.width = w; sketch.height = h;
    sketch.style.width = w + 'px'; sketch.style.height = h + 'px';
    sketch.hidden = false;
    panel.dataset.empty = 'false';
    resetPose();
    render();
    $('status').textContent = 'Sketsa siap' + (name ? ': ' + name : '') + '. Tekan Buka kamera.';
    toast('Geser dengan satu jari, cubit dengan dua jari');
  }

  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) { toast('Pilih file gambar'); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { setSource(img, file.name); URL.revokeObjectURL(url); };
    img.onerror = () => { URL.revokeObjectURL(url); toast('Gambar tidak bisa dibaca'); };
    img.src = url;
  }

  $('pick').onclick = $('btnPick').onclick = () => $('file').click();
  $('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

  $('btnSample').onclick = () => {
    const c = document.createElement('canvas'); c.width = c.height = 900;
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, 900, 900);
    g.strokeStyle = '#111'; g.lineWidth = 7; g.lineJoin = 'round'; g.lineCap = 'round';
    const cx = 450, cy = 450, R = 320;
    const pts = [];
    for (let i = 0; i < 6; i++) { const a = (-90 + i * 60) * Math.PI / 180; pts.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]); }
    g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.stroke();
    [1, 3, 5].forEach(i => { g.beginPath(); g.moveTo(cx, cy); g.lineTo(pts[i][0], pts[i][1]); g.stroke(); });
    g.lineWidth = 5;
    g.beginPath(); g.ellipse(cx, cy - R / 2, R * .3, R * .17, 0, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.moveTo(cx - 150, cy + 130); g.lineTo(cx - 150, cy + 230); g.moveTo(cx + 150, cy + 130); g.lineTo(cx + 150, cy + 230); g.stroke();
    setSource(c, 'contoh kubus');
  };

  function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

  let raf = 0;
  function renderSoon() { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }
  function render() {
    if (!src) return;
    sketch.style.opacity = opt.opacity / 100;
    if (opt.mode === 'foto') {
      ctx.clearRect(0, 0, sketch.width, sketch.height);
      ctx.drawImage(src, 0, 0);
      return;
    }
    const d = srcData.data, o = outData.data, thr = opt.thr, rgb = hexToRgb(opt.color);
    for (let i = 0; i < d.length; i += 4) {
      const l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      let a = (thr - l) / 60; a = a < 0 ? 0 : a > 1 ? 1 : a;
      o[i] = rgb[0]; o[i + 1] = rgb[1]; o[i + 2] = rgb[2]; o[i + 3] = a * 255;
    }
    ctx.putImageData(outData, 0, 0);
  }

  /* ---------- Posisi & gestur ---------- */
  function apply() {
    sketch.style.transform =
      `translate(-50%,-50%) translate(${st.x}px,${st.y}px) rotate(${st.r}rad) scale(${st.flip ? -st.s : st.s},${st.s})`;
  }
  let applyRaf = 0;
  function applySoon() {
    if (applyRaf) return;
    applyRaf = requestAnimationFrame(() => { applyRaf = 0; apply(); });
  }
  function resetPose() {
    if (!src) return;
    st.s = Math.min(innerWidth * 0.86 / sketch.width, innerHeight * 0.5 / sketch.height);
    st.x = 0; st.y = -innerHeight * 0.08; st.r = 0; st.flip = false;
    $('flip').setAttribute('aria-pressed', 'false');
    apply();
  }

  const ptrs = new Map();
  let base = null, g = null;
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const ang = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);

  function begin() {
    base = { ...st };
    const p = [...ptrs.values()];
    if (p.length === 1) g = { t: 'drag', p0: { ...p[0] } };
    else if (p.length >= 2) g = { t: 'pinch', m0: mid(p[0], p[1]), d0: Math.max(dist(p[0], p[1]), 1), a0: ang(p[0], p[1]) };
    else g = null;
  }

  stage.addEventListener('pointerdown', e => {
    if (opt.locked || !src) return;
    stage.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    begin();
  });
  stage.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId) || !g) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const p = [...ptrs.values()];
    if (g.t === 'drag') {
      st.x = base.x + (p[0].x - g.p0.x);
      st.y = base.y + (p[0].y - g.p0.y);
    } else if (p.length >= 2) {
      const m = mid(p[0], p[1]), k = dist(p[0], p[1]) / g.d0, da = ang(p[0], p[1]) - g.a0;
      const cx = innerWidth / 2, cy = innerHeight / 2;
      const vx = cx + base.x - g.m0.x, vy = cy + base.y - g.m0.y;
      const cos = Math.cos(da), sin = Math.sin(da);
      st.x = m.x + k * (vx * cos - vy * sin) - cx;
      st.y = m.y + k * (vx * sin + vy * cos) - cy;
      st.s = Math.min(40, Math.max(0.02, base.s * k));
      st.r = base.r + da;
    }
    applySoon();
  });
  const up = e => { ptrs.delete(e.pointerId); begin(); };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e => {
    if (opt.locked || !src) return;
    e.preventDefault();
    if (e.shiftKey) st.r += e.deltaY * 0.002;
    else st.s = Math.min(40, Math.max(0.02, st.s * Math.exp(-e.deltaY * 0.0015)));
    apply();
  }, { passive: false });

  /* ---------- Kontrol ---------- */
  $('lock').onclick = e => {
    opt.locked = !opt.locked;
    stage.classList.toggle('locked', opt.locked);
    e.currentTarget.setAttribute('aria-pressed', String(opt.locked));
    $('lockPath').setAttribute('d', opt.locked ? 'M8 11V8a4 4 0 0 1 8 0v3' : 'M8 11V8a4 4 0 0 1 7.6-1.7');
    toast(opt.locked ? 'Sketsa dikunci' : 'Sketsa bisa digeser lagi');
  };
  $('flip').onclick = e => {
    st.flip = !st.flip;
    e.currentTarget.setAttribute('aria-pressed', String(st.flip));
    apply();
  };
  $('gridBtn').onclick = e => {
    const on = $('grid').hidden;
    $('grid').hidden = !on;
    e.currentTarget.setAttribute('aria-pressed', String(on));
  };
  $('reset').onclick = resetPose;

  function setMode(m) {
    opt.mode = m;
    $('modeFoto').setAttribute('aria-pressed', String(m === 'foto'));
    $('modeGaris').setAttribute('aria-pressed', String(m === 'garis'));
    $('swatches').hidden = m !== 'garis';
    $('thrRow').hidden = m !== 'garis';
    render();
  }
  $('modeFoto').onclick = () => setMode('foto');
  $('modeGaris').onclick = () => setMode('garis');

  document.querySelectorAll('.sw').forEach(b => b.onclick = () => {
    opt.color = b.dataset.c;
    document.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    renderSoon();
  });
  $('opacity').oninput = e => { opt.opacity = +e.target.value; $('opacityOut').textContent = opt.opacity + '%'; sketch.style.opacity = opt.opacity / 100; };
  $('thr').oninput = e => { opt.thr = +e.target.value; $('thrOut').textContent = opt.thr; renderSoon(); };

  $('hideUI').onclick = () => { document.body.classList.add('clean'); toast('Ketuk ikon mata untuk menampilkan kontrol'); };
  $('showUI').onclick = () => document.body.classList.remove('clean');
})();
</script>
</body>
</html>
